# Valid content, but the .yml extension means bawbel-gate lint would never read it.
# The action must refuse the directory instead of passing it.
schema: bawbel/capability-manifest/v1
subject:
  kind: mcp-server
  name: reader
  transport: stdio

provenance_class: tool.response.reader
instruction_authority: none

trifecta:
  private_data: false
  untrusted_content: true
  external_comms: false

grants:
  tools:
    - name: get_file
      effect: allow
    - name: "*"
      effect: deny
