version: 2
updates:
  # Keeps the commit SHAs pinned in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    # Feature -> develop -> main: without this, Dependabot targets the default branch, main.
    target-branch: develop
    schedule:
      interval: weekly

  # Keeps the npm dependencies of the VS Code extension (vscode/package-lock.json) current.
  - package-ecosystem: npm
    directory: /vscode
    target-branch: develop
    schedule:
      interval: weekly

  # Keeps the Python dependencies declared in pyproject.toml current. It declares none today.
  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
