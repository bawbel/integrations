# Type-checks, builds, tests and packages the VS Code extension in vscode/.
# The .vsix is kept as a workflow artifact only. Building one on a tag and attaching it to a
# release is a separate task.
name: VS Code extension

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  extension:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # @vscode/vsce 4 needs Node 22 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # --ignore-scripts: compiling and packaging need no install script.
      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      - name: Type check (npm run lint)
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Package the extension
        run: npm run package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bawbel-scanner-vsix
          path: vscode/*.vsix
          if-no-files-found: error
