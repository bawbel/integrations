# Every action and pre-commit rev in this repo is pinned by commit SHA (RELEASING.md).
# fetch-depth 0 brings the tags, which the checker needs to compare a SHA with its release.
# The test step runs only tests/test_check_pins.py. The hook tests need the installed package, so
# they run in Hook tests (hooks.yml), where BAWBEL_HOOK_TESTS_REQUIRED=1 turns a skip into a failure.
name: Pins

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every action and rev is pinned by commit SHA
        run: python3 scripts/check_pins.py

      - name: Pin checker tests (tests/test_check_pins.py)
        run: python3 -m unittest tests.test_check_pins -v
