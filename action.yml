name: Bawbel Scanner
description: "Scan agentic AI components — MCP servers, skills, system prompts — for AVE vulnerabilities before they reach production."
author: Bawbel

branding:
  icon: shield
  color: green

inputs:
  path:
    description: "Path to scan (file or directory)"
    required: false
    default: "."

  recursive:
    description: "Scan directories recursively"
    required: false
    default: "true"

  fail-on-severity:
    description: "Exit with code 2 if findings at this severity or above. One of: critical, high, medium, low, none"
    required: false
    default: "high"

  format:
    description: "Output format. One of: text, json, sarif"
    required: false
    default: "sarif"

  no-ignore:
    description: "Override all bawbel-ignore suppressions (audit mode)"
    required: false
    default: "false"

  version:
    description: "Bawbel Scanner version to install (default: latest)"
    required: false
    default: "latest"

  extras:
    description: "pip extras to install. One of: yara, semgrep, llm, magika, all"
    required: false
    default: "all"

outputs:
  sarif-file:
    description: "Path to the generated SARIF file (when format is sarif)"
    value: ${{ steps.scan.outputs.sarif-file }}

  findings-count:
    description: "Number of active findings"
    value: ${{ steps.scan.outputs.findings-count }}

  risk-score:
    description: "Risk score 0.0 to 10.0"
    value: ${{ steps.scan.outputs.risk-score }}

  result:
    description: "clean or findings"
    value: ${{ steps.scan.outputs.result }}

runs:
  using: composite
  steps:
    - name: Install Bawbel Scanner
      shell: bash
      env:
        BAWBEL_VERSION: ${{ inputs.version }}
        BAWBEL_EXTRAS: ${{ inputs.extras }}
      run: |
        if [ "$BAWBEL_VERSION" = "latest" ]; then
          pip install "bawbel-scanner[${BAWBEL_EXTRAS}]" --quiet
        else
          pip install "bawbel-scanner[${BAWBEL_EXTRAS}]==${BAWBEL_VERSION}" --quiet
        fi

    # Fail closed: a scanner error, or output that is not JSON, fails this step.
    # It never reads as a clean result.
    - name: Run Bawbel scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_FORMAT: ${{ inputs.format }}
        SCAN_RECURSIVE: ${{ inputs.recursive }}
        SCAN_NO_IGNORE: ${{ inputs.no-ignore }}
      run: |
        ARGS=()
        if [ "$SCAN_RECURSIVE" = "true" ]; then
          ARGS+=(--recursive)
        fi
        if [ "$SCAN_NO_IGNORE" = "true" ]; then
          ARGS+=(--no-ignore)
        fi
        ERR_LOG="$(mktemp)"

        if [ "$SCAN_FORMAT" = "sarif" ]; then
          SARIF_FILE="bawbel-results.sarif"
          if ! bawbel scan "$SCAN_PATH" "${ARGS[@]}" --format sarif > "$SARIF_FILE" 2> "$ERR_LOG"; then
            cat "$ERR_LOG" >&2
            echo "::error::bawbel scan failed while writing SARIF"
            exit 1
          fi
          echo "sarif-file=$SARIF_FILE" >> "$GITHUB_OUTPUT"
        fi

        if ! JSON_OUT=$(bawbel scan "$SCAN_PATH" "${ARGS[@]}" --format json 2> "$ERR_LOG"); then
          cat "$ERR_LOG" >&2
          echo "::error::bawbel scan failed"
          exit 1
        fi

        if ! SUMMARY=$(printf '%s' "$JSON_OUT" | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        data = data if isinstance(data, list) else [data]
        total = sum(len(r.get('findings', [])) for r in data)
        score = max((r.get('risk_score', 0) for r in data), default=0)
        print('count=' + str(total))
        print('score=' + str(round(score, 1)))
        print('result=' + ('findings' if total > 0 else 'clean'))
        "); then
          cat "$ERR_LOG" >&2
          echo "::error::bawbel scan output is not JSON: no scannable files under the path, or the scanner failed"
          exit 1
        fi

        echo "findings-count=$(echo "$SUMMARY" | grep '^count=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"
        echo "risk-score=$(echo "$SUMMARY" | grep '^score=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"
        echo "result=$(echo "$SUMMARY" | grep '^result=' | cut -d= -f2)" >> "$GITHUB_OUTPUT"

    - name: Check severity threshold
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_RECURSIVE: ${{ inputs.recursive }}
        SCAN_NO_IGNORE: ${{ inputs.no-ignore }}
        FAIL_ON: ${{ inputs.fail-on-severity }}
        COUNT: ${{ steps.scan.outputs.findings-count }}
      run: |
        if [ "$FAIL_ON" = "none" ] || [ "$COUNT" = "0" ]; then
          exit 0
        fi

        ARGS=()
        if [ "$SCAN_RECURSIVE" = "true" ]; then
          ARGS+=(--recursive)
        fi
        if [ "$SCAN_NO_IGNORE" = "true" ]; then
          ARGS+=(--no-ignore)
        fi

        bawbel scan "$SCAN_PATH" "${ARGS[@]}" --fail-on-severity "$FAIL_ON" --format text
